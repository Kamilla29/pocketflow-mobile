name: Mobile quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check Expo dependency alignment
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: TypeScript
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Metro export smoke test
        run: npm run bundle

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: ignore
