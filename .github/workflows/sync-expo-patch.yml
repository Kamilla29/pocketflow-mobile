name: Sync Expo patch

on:
  push:
    branches:
      - chore/verified-runtime-screenshots

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[expo synced]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Update Expo patch and lockfile
        run: npm install 'expo@~57.0.21' --save

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Commit synchronized package metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: align Expo SDK patch [expo synced]'
          git push origin HEAD:${GITHUB_REF_NAME}
