<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">PocketFlow Mobile portfolio cover</title>
  <desc id="desc">Illustrative portfolio cover showing PocketFlow product areas and engineering stack. This is not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="190" fill="#2563eb" opacity="0.12"/>
  <circle cx="100" cy="500" r="220" fill="#38bdf8" opacity="0.08"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="105" fill="#93c5fd" font-size="20" font-weight="700" letter-spacing="3">MOBILE PORTFOLIO PROJECT</text>
    <text x="72" y="164" fill="#ffffff" font-size="52" font-weight="800">PocketFlow Mobile</text>
    <text x="72" y="207" fill="#cbd5e1" font-size="23">React Native + TypeScript product architecture</text>

    <g transform="translate(72 250)">
      <rect width="166" height="42" rx="21" fill="#1d4ed8"/>
      <text x="83" y="27" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Typed navigation</text>
      <rect x="178" width="154" height="42" rx="21" fill="#1e40af"/>
      <text x="255" y="27" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Resilient state</text>
      <rect x="344" width="130" height="42" rx="21" fill="#0f766e"/>
      <text x="409" y="27" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Testing</text>
      <rect x="486" width="126" height="42" rx="21" fill="#6d28d9"/>
      <text x="549" y="27" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">CI / CD</text>
    </g>

    <g transform="translate(72 338)">
      <text x="0" y="0" fill="#94a3b8" font-size="15" font-weight="700" letter-spacing="2">ENGINEERING SIGNALS</text>
      <text x="0" y="38" fill="#e2e8f0" font-size="19">TanStack Query · Zustand · Zod · Jest · Maestro</text>
      <text x="0" y="72" fill="#e2e8f0" font-size="19">GitHub Actions · Jenkins Pipeline · Expo</text>
      <text x="0" y="122" fill="#64748b" font-size="15">Illustrative repository cover — not an application screenshot</text>
    </g>

    <g transform="translate(760 62)" filter="url(#shadow)">
      <rect width="238" height="436" rx="34" fill="#020617"/>
      <rect x="10" y="10" width="218" height="416" rx="27" fill="url(#phone)"/>
      <rect x="86" y="22" width="66" height="7" rx="4" fill="#cbd5e1"/>
      <text x="30" y="72" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1">POCKETFLOW</text>
      <text x="30" y="104" fill="#0f172a" font-size="22" font-weight="800">Loan overview</text>
      <rect x="30" y="127" width="178" height="74" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="45" y="151" fill="#64748b" font-size="11" font-weight="700">CURRENT APPLICATION</text>
      <text x="45" y="177" fill="#0f172a" font-size="17" font-weight="800">LF-PORTFOLIO-2026</text>
      <rect x="30" y="218" width="84" height="68" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="124" y="218" width="84" height="68" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="42" y="240" fill="#64748b" font-size="10">Payment</text>
      <text x="42" y="264" fill="#0f172a" font-size="16" font-weight="800">8 496 Kč</text>
      <text x="136" y="240" fill="#64748b" font-size="10">Progress</text>
      <text x="136" y="264" fill="#0f172a" font-size="16" font-weight="800">13%</text>
      <rect x="30" y="305" width="178" height="43" rx="11" fill="#2563eb"/>
      <text x="119" y="332" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Payment schedule</text>
      <rect x="30" y="359" width="178" height="43" rx="11" fill="#eef2ff"/>
      <text x="119" y="386" fill="#3730a3" font-size="13" font-weight="700" text-anchor="middle">Application checklist</text>
    </g>

    <g transform="translate(1012 98)" filter="url(#shadow)">
      <rect width="196" height="360" rx="30" fill="#020617"/>
      <rect x="9" y="9" width="178" height="342" rx="23" fill="#111827"/>
      <rect x="72" y="20" width="52" height="6" rx="3" fill="#475569"/>
      <text x="25" y="70" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1">PREFERENCES</text>
      <text x="25" y="98" fill="#f8fafc" font-size="20" font-weight="800">Settings</text>
      <rect x="25" y="118" width="146" height="82" rx="13" fill="#1f2937"/>
      <text x="38" y="142" fill="#f8fafc" font-size="12" font-weight="700">Appearance</text>
      <rect x="38" y="158" width="37" height="27" rx="8" fill="#334155"/>
      <rect x="80" y="158" width="37" height="27" rx="8" fill="#334155"/>
      <rect x="122" y="158" width="37" height="27" rx="8" fill="#2563eb"/>
      <text x="56" y="176" fill="#cbd5e1" font-size="8" text-anchor="middle">Auto</text>
      <text x="98" y="176" fill="#cbd5e1" font-size="8" text-anchor="middle">Light</text>
      <text x="140" y="176" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">Dark</text>
      <rect x="25" y="215" width="146" height="88" rx="13" fill="#1f2937"/>
      <text x="38" y="240" fill="#f8fafc" font-size="11" font-weight="700">Local preferences</text>
      <line x1="38" y1="258" x2="158" y2="258" stroke="#334155"/>
      <line x1="38" y1="280" x2="158" y2="280" stroke="#334155"/>
      <circle cx="151" cy="246" r="7" fill="#22c55e"/>
      <circle cx="151" cy="269" r="7" fill="#64748b"/>
      <circle cx="151" cy="292" r="7" fill="#22c55e"/>
    </g>
  </g>
</svg>
